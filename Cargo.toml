[package]
name = "fpo-rust"
version = "0.1.0"
edition = "2021"
description = "Fast license plate OCR inference in pure Rust - a port of fast-plate-ocr with ONNX model support"
license = "MIT"
repository = "https://github.com/alparslanahmed/fpo-rust"
homepage = "https://github.com/alparslanahmed/fpo-rust"
documentation = "https://docs.rs/fpo-rust"
readme = "README.md"
keywords = ["ocr", "license-plate", "onnx", "inference"]
categories = ["computer-vision", "machine-learning"]
authors = ["fpo-rust contributors"]

[[bin]]
name = "fpo-rust"
path = "src/main.rs"

[lib]
name = "fpo_rust"
path = "src/lib.rs"

[dependencies]
# Pure-Rust ONNX Runtime
tract-onnx = "0.22.1"
# Image loading and resizing
image = "0.25.10"
# Serialization / YAML config parsing
serde = { version = "1.0.228", features = ["derive"] }
serde_yml = "0.0.12"
# HTTP downloads for model hub
ureq = "3.3.0"
# Error handling
anyhow = "1.0.102"
thiserror = "2.0.18"
# Download progress bar
indicatif = "0.18.4"
# Platform directories (for cache dir)
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3.27.0"
